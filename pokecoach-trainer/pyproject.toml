[project]
name = "pokecoach-trainer"
version = "0.1.0"
description = "Trainer BC Tiny pour PokeCoach (palier 1)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vgc-bench",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "huggingface-hub>=0.26",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
pokecoach-trainer = "pokecoach_trainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokecoach_trainer"]

[tool.uv.sources]
vgc-bench = { path = "vendor/vgc-bench", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
