# Recette alignée sur la collecte filtrée M-C (profil dataset collectable).
dataset:
  variant: natural
  regulation: M-C
  target_replays: 100000
  seed: 42
  min_elo: 1100
  max_elo: null
  unknown_elo: exclude_perspective
  only_winners: false
  require_ots: true
  require_complete_teams: true
  include_bo1: true
  include_bo3: true
  include_forfeits: true
  min_completed_turns_forfeit: 2
  exclude_inactivity_losses: true
  deduplicate: true
  max_replays_per_team: null
  splits:
    train: 0.80
    validation: 0.10
    test: 0.10
